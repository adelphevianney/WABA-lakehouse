# =============================================================================
# WABA Group — stack locale, organisée en profils Docker Compose.
#
#   --profile l1   MinIO + catalogue Iceberg REST + Trino  (+ Spark, Streamlit)
#   --profile l2   ajoute Airflow
#   --profile l3   ajoute Kafka + NiFi
#
# La machine cible du développement dispose de 16 Go de RAM : les profils sont
# volontairement exclusifs plutôt que cumulatifs, et chaque service porte une
# limite mémoire explicite. Voir docs/writeup/ pour la justification.
# =============================================================================
name: waba

x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant - copier README.env.example en .env}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
  AWS_REGION: ${AWS_REGION:-us-east-1}

services:

  # ---------------------------------------------------------------------------
  # Level 1.2 — Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE}
    container_name: waba-minio
    profiles: ["l1", "l2", "l3", "l4"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    mem_limit: 1g
    networks: [waba]

  # Création idempotente des trois buckets du sujet. Conteneur one-shot.
  minio-init:
    image: ${MC_IMAGE}
    container_name: waba-minio-init
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      BUCKET_RAW: ${BUCKET_RAW:-raw-landing}
      BUCKET_LAKEHOUSE: ${BUCKET_LAKEHOUSE:-lakehouse}
      BUCKET_ARCHIVE: ${BUCKET_ARCHIVE:-archive}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set waba http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "waba/$$BUCKET_RAW" "waba/$$BUCKET_LAKEHOUSE" "waba/$$BUCKET_ARCHIVE"
        echo "--- Buckets WABA ---"
        mc ls waba
    restart: "no"
    networks: [waba]

  # Le service iceberg-rest tourne en uid 1000, alors que Docker initialise tout
  # volume nommé en root:root — SQLite ne peut alors pas créer sa base. Ce
  # conteneur one-shot aligne les droits ; c'est l'exact équivalent Compose de
  # l'initContainer qui sera utilisé dans les manifestes Kubernetes du Level 4.
  catalog-init:
    image: ${MC_IMAGE}
    container_name: waba-catalog-init
    profiles: ["l1", "l2", "l3", "l4"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /persist
        chown -R 1000:1000 /persist
        echo "Volume du catalogue Iceberg prêt (uid 1000)"
    volumes:
      - iceberg-catalog:/persist
    restart: "no"
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.3 — Catalogue Iceberg
  # Choix : catalogue REST (autorisé par le sujet) plutôt qu'un Hive Metastore,
  # qui aurait imposé un Postgres supplémentaire pour ~1,5 Go de RAM en plus.
  # Métadonnées persistées dans un SQLite sur volume : le catalogue survit à un
  # `down` sans `-v`, condition nécessaire pour démontrer l'idempotence.
  # ---------------------------------------------------------------------------
  iceberg-rest:
    image: ${ICEBERG_REST_IMAGE}
    container_name: waba-iceberg-rest
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-credentials
      CATALOG_URI: jdbc:sqlite:/persist/waba_catalog.db
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://lakehouse/}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    volumes:
      - iceberg-catalog:/persist
    mem_limit: 768m
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.4 — Moteur de requêtes SQL
  # ---------------------------------------------------------------------------
  trino:
    image: ${TRINO_IMAGE}
    container_name: waba-trino
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      iceberg-rest:
        condition: service_started
    environment:
      # Injectés dans le catalogue via la syntaxe ${ENV:...} de Trino :
      # aucun credential n'est écrit en clair dans les fichiers de config.
      <<: *s3-credentials
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      # Les requêtes analytiques sont montées plutôt que passées en ligne de
      # commande : le client les exécute depuis un fichier, ce qui évite tout
      # échappement du SQL par le shell appelant.
      - ../sql:/sql:ro
    healthcheck:
      # `/v1/info` répond bien avant que le coordinateur n'accepte des requêtes :
      # se contenter d'un code 200 déclare le service prêt trop tôt et la
      # première requête échoue. On attend que le champ `starting` retombe.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    mem_limit: 3g
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.1 — Application de génération de données
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      # Racine du dépôt : l'application dépend aussi du paquet `common`.
      context: ..
      dockerfile: docker/streamlit/Dockerfile
    image: waba/generator:${WABA_VERSION:-dev}
    container_name: waba-streamlit
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-credentials
      MINIO_ENDPOINT: http://minio:9000
      BUCKET_RAW: ${BUCKET_RAW:-raw-landing}
      WABA_PII_KEY: ${WABA_PII_KEY:-}
      WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-17.5}
      TZ: ${TZ:-UTC}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    # Les référentiels à pleine volumétrie (500 000 clients, 800 000 comptes)
    # et leurs vues pré-découpées par pays occupent environ 2 Go en mémoire.
    mem_limit: 3g
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.3 — Exécution des jobs PySpark
  # ---------------------------------------------------------------------------
  # Spark tourne en mode local dans un conteneur unique. Un cluster autonome
  # avec un master et un worker n'apporterait rien sur ces volumétries, et
  # coûterait 3 Go de mémoire supplémentaires sur une machine qui en compte 16.
  spark:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    image: waba/spark:${WABA_VERSION:-dev}
    container_name: waba-spark
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-credentials
      MINIO_ENDPOINT: http://minio:9000
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://lakehouse/}
      BUCKET_RAW: ${BUCKET_RAW:-raw-landing}
      BUCKET_ARCHIVE: ${BUCKET_ARCHIVE:-archive}
      WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-17.5}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "python3", "-c", "import pyspark, boto3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    mem_limit: 3g
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 2.1 — Orchestration
  # ---------------------------------------------------------------------------
  airflow-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: waba-airflow-db
    profiles: ["l2", "l3", "l4"]
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks: [waba]

  # Bloc commun aux services Airflow : même image, même configuration, même
  # accès au démon Docker.
  airflow-init:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    image: waba/airflow:${WABA_VERSION:-dev}
    container_name: waba-airflow-init
    profiles: ["l2", "l3", "l4"]
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Les DAGs sont déployés en pause. Démarrer la plateforme ne doit pas
      # déclencher immédiatement toute la chaîne de traitement : l'exploitant
      # active ce qu'il veut, quand il le veut.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Chaque tâche démarre un conteneur Spark d'environ 2 Go. Sur une machine
      # de 16 Go partagée avec MinIO, Trino et le reste de la stack, laisser
      # Airflow en paralléliser davantage épuiserait la mémoire — les trois
      # tâches Gold à elles seules en réclameraient 6.
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?}@airflow-db/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      # Les identifiants MinIO sont déclarés comme une **Connection** Airflow,
      # que les DAGs référencent par `{{ conn.waba_minio.login }}`. Aucun secret
      # n'apparaît donc dans le code des DAGs, conformément au §2.1.
      AIRFLOW_CONN_WABA_MINIO: >-
        {"conn_type":"generic","host":"minio","port":9000,
         "login":"${MINIO_ROOT_USER:?}","password":"${MINIO_ROOT_PASSWORD:?}"}
      AIRFLOW_VAR_WABA_SPARK_IMAGE: waba/spark:${WABA_VERSION:-dev}
      AIRFLOW_VAR_WABA_MINIO_ENDPOINT: http://minio:9000
      AIRFLOW_VAR_WABA_ICEBERG_REST_URI: http://iceberg-rest:8181
      AIRFLOW_VAR_WABA_COUNTRIES: ${WABA_COUNTRIES:-CI,SN,ML,BF,GN,TG,BJ,GH}
      AIRFLOW_VAR_WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-17.5}
      AIRFLOW_VAR_WABA_PII_KEY: ${WABA_PII_KEY:-}
    volumes: &airflow-volumes
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      # Accès au démon : c'est par ce socket qu'Airflow démarre les conteneurs
      # Spark. Monté en lecture-écriture car lancer un conteneur est une écriture.
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname WABA --lastname Admin --role Admin --email admin@waba.local || true
        echo "Airflow initialisé"
    restart: "no"
    networks: [waba]

  airflow-scheduler:
    image: waba/airflow:${WABA_VERSION:-dev}
    container_name: waba-airflow-scheduler
    profiles: ["l2", "l3", "l4"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    # Le socket Docker appartient à root:root en 660. Ajouter le groupe root au
    # conteneur suffit à lui en donner l'accès, sans toucher aux permissions du
    # socket lui-même — un `chmod 666` l'ouvrirait à tout l'hôte, bien au-delà
    # du périmètre de ce projet.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 1500m
    networks: [waba]

  airflow-webserver:
    image: waba/airflow:${WABA_VERSION:-dev}
    container_name: waba-airflow-webserver
    profiles: ["l2", "l3", "l4"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "${AIRFLOW_PORT:-8090}:8080"
    command: ["webserver"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    mem_limit: 1200m
    networks: [waba]

volumes:
  minio-data:
  iceberg-catalog:
  airflow-db:
  airflow-logs:

networks:
  waba:
    name: waba
