# =============================================================================
# WABA Group — stack locale, organisée en profils Docker Compose.
#
#   --profile l1   MinIO + catalogue Iceberg REST + Trino  (+ Spark, Streamlit)
#   --profile l2   ajoute Airflow
#   --profile l3   ajoute Kafka + NiFi
#
# La machine cible du développement dispose de 16 Go de RAM : les profils sont
# volontairement exclusifs plutôt que cumulatifs, et chaque service porte une
# limite mémoire explicite. Voir docs/writeup/ pour la justification.
# =============================================================================
name: waba

x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant - copier README.env.example en .env}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
  AWS_REGION: ${AWS_REGION:-us-east-1}

services:

  # ---------------------------------------------------------------------------
  # Level 1.2 — Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE}
    container_name: waba-minio
    profiles: ["l1", "l2", "l3", "l4"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    mem_limit: 1g
    networks: [waba]

  # Création idempotente des trois buckets du sujet. Conteneur one-shot.
  minio-init:
    image: ${MC_IMAGE}
    container_name: waba-minio-init
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      BUCKET_RAW: ${BUCKET_RAW:-raw-landing}
      BUCKET_LAKEHOUSE: ${BUCKET_LAKEHOUSE:-lakehouse}
      BUCKET_ARCHIVE: ${BUCKET_ARCHIVE:-archive}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set waba http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "waba/$$BUCKET_RAW" "waba/$$BUCKET_LAKEHOUSE" "waba/$$BUCKET_ARCHIVE"
        echo "--- Buckets WABA ---"
        mc ls waba
    restart: "no"
    networks: [waba]

  # Le service iceberg-rest tourne en uid 1000, alors que Docker initialise tout
  # volume nommé en root:root — SQLite ne peut alors pas créer sa base. Ce
  # conteneur one-shot aligne les droits ; c'est l'exact équivalent Compose de
  # l'initContainer qui sera utilisé dans les manifestes Kubernetes du Level 4.
  catalog-init:
    image: ${MC_IMAGE}
    container_name: waba-catalog-init
    profiles: ["l1", "l2", "l3", "l4"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /persist
        chown -R 1000:1000 /persist
        echo "Volume du catalogue Iceberg prêt (uid 1000)"
    volumes:
      - iceberg-catalog:/persist
    restart: "no"
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.3 — Catalogue Iceberg
  # Choix : catalogue REST (autorisé par le sujet) plutôt qu'un Hive Metastore,
  # qui aurait imposé un Postgres supplémentaire pour ~1,5 Go de RAM en plus.
  # Métadonnées persistées dans un SQLite sur volume : le catalogue survit à un
  # `down` sans `-v`, condition nécessaire pour démontrer l'idempotence.
  # ---------------------------------------------------------------------------
  iceberg-rest:
    image: ${ICEBERG_REST_IMAGE}
    container_name: waba-iceberg-rest
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-credentials
      # SQLite verrouille le fichier entier : deux commits simultanés — le job
      # batch et un flux de streaming, par exemple — se disputent le verrou et
      # le second reçoit SQLITE_BUSY, que le catalogue traduit en 500. Côté
      # Iceberg cela devient un `CommitStateUnknownException`, le pire des
      # échecs puisqu'on ignore si le commit a été appliqué. Le délai d'attente
      # fait patienter l'écrivain plutôt que de le rejeter aussitôt.
      #
      # Le journal WAL serait le réflexe suivant ; il aggrave le cas présent.
      # Le catalogue JDBC ouvre une transaction en lecture puis la promeut en
      # écriture, ce que WAL refuse dès qu'une autre connexion a écrit
      # entre-temps — SQLITE_BUSY_SNAPSHOT, sur lequel aucun délai d'attente
      # n'a de prise.
      #
      # Piège à connaître : le mode journal est inscrit **dans le fichier**, pas
      # dans la chaîne de connexion. L'avoir activé une fois le rend permanent,
      # et le retirer d'ici ne le désactive pas. Rétablir le journal classique
      # sur une base déjà basculée demande, service arrêté :
      #   PRAGMA wal_checkpoint(TRUNCATE); PRAGMA journal_mode=DELETE;
      #
      # Les écritures concurrentes sont sérialisées de deux façons, chacune à sa
      # portée : un verrou dans le pilote Spark pour les flux d'un même processus
      # (jobs/streaming/iceberg_sink.py), un pool Airflow à un emplacement pour
      # les tâches batch, qui tournent chacune dans son propre conteneur. Un
      # catalogue adossé à PostgreSQL accepterait ces écritures nativement et
      # rendrait les deux inutiles — c'est le déploiement que vise le Level 4.
      CATALOG_URI: jdbc:sqlite:file:/persist/waba_catalog.db?busy_timeout=30000
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://lakehouse/}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    volumes:
      - iceberg-catalog:/persist
    mem_limit: 768m
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.4 — Moteur de requêtes SQL
  # ---------------------------------------------------------------------------
  trino:
    image: ${TRINO_IMAGE}
    container_name: waba-trino
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      iceberg-rest:
        condition: service_started
    environment:
      # Injectés dans le catalogue via la syntaxe ${ENV:...} de Trino :
      # aucun credential n'est écrit en clair dans les fichiers de config.
      <<: *s3-credentials
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Le fuseau de session de Trino est celui de la JVM. Le laisser au fuseau
      # de la machine ferait diverger un horodatage lu dans Iceberg de son
      # équivalent lu dans Kafka, et la requête Lambda comparerait des instants
      # décalés — huit pays sur trois fuseaux, la question n'est pas théorique.
      TZ: ${TZ:-UTC}
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      # Descriptions des topics Kafka (§3.4). Un topic ne transporte que des
      # octets : ce sont ces fichiers qui donnent un type à chaque champ, et
      # rendent le bus interrogeable en SQL au même titre que le lakehouse.
      - ./trino/kafka:/etc/trino/kafka:ro
      # Les requêtes analytiques sont montées plutôt que passées en ligne de
      # commande : le client les exécute depuis un fichier, ce qui évite tout
      # échappement du SQL par le shell appelant.
      - ../sql:/sql:ro
    healthcheck:
      # `/v1/info` répond bien avant que le coordinateur n'accepte des requêtes :
      # se contenter d'un code 200 déclare le service prêt trop tôt et la
      # première requête échoue. On attend que le champ `starting` retombe.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    mem_limit: 3g
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.1 — Application de génération de données
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      # Racine du dépôt : l'application dépend aussi du paquet `common`.
      context: ..
      dockerfile: docker/streamlit/Dockerfile
    image: waba/generator:${WABA_VERSION:-dev}
    container_name: waba-streamlit
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-credentials
      MINIO_ENDPOINT: http://minio:9000
      BUCKET_RAW: ${BUCKET_RAW:-raw-landing}
      WABA_PII_KEY: ${WABA_PII_KEY:-}
      WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-17.5}
      TZ: ${TZ:-UTC}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    # Les référentiels à pleine volumétrie (500 000 clients, 800 000 comptes)
    # et leurs vues pré-découpées par pays occupent environ 2 Go en mémoire.
    mem_limit: 3g
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 1.3 — Exécution des jobs PySpark
  # ---------------------------------------------------------------------------
  # Spark tourne en mode local dans un conteneur unique. Un cluster autonome
  # avec un master et un worker n'apporterait rien sur ces volumétries, et
  # coûterait 3 Go de mémoire supplémentaires sur une machine qui en compte 16.
  spark:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    image: waba/spark:${WABA_VERSION:-dev}
    container_name: waba-spark
    profiles: ["l1", "l2", "l3", "l4"]
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-credentials
      MINIO_ENDPOINT: http://minio:9000
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://lakehouse/}
      BUCKET_RAW: ${BUCKET_RAW:-raw-landing}
      BUCKET_ARCHIVE: ${BUCKET_ARCHIVE:-archive}
      WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-17.5}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      # Level 3 — accès au bus depuis les jobs de streaming.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WABA_CHECKPOINT_DIR: /checkpoints
      TZ: ${TZ:-UTC}
    volumes:
      # Les points de reprise du streaming survivent au conteneur : sans cela,
      # un redémarrage relirait les topics depuis le début et rejouerait tout.
      - spark-checkpoints:/checkpoints
    healthcheck:
      test: ["CMD", "python3", "-c", "import pyspark, boto3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    mem_limit: 3g
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 2.1 — Orchestration
  # ---------------------------------------------------------------------------
  airflow-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: waba-airflow-db
    profiles: ["l2", "l3", "l4"]
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks: [waba]

  # Bloc commun aux services Airflow : même image, même configuration, même
  # accès au démon Docker.
  airflow-init:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    image: waba/airflow:${WABA_VERSION:-dev}
    container_name: waba-airflow-init
    profiles: ["l2", "l3", "l4"]
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Les DAGs sont déployés en pause. Démarrer la plateforme ne doit pas
      # déclencher immédiatement toute la chaîne de traitement : l'exploitant
      # active ce qu'il veut, quand il le veut.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Chaque tâche démarre un conteneur Spark d'environ 2 Go. Sur une machine
      # de 16 Go partagée avec MinIO, Trino et le reste de la stack, laisser
      # Airflow en paralléliser davantage épuiserait la mémoire — les trois
      # tâches Gold à elles seules en réclameraient 6.
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?}@airflow-db/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      # Les identifiants MinIO sont déclarés comme une **Connection** Airflow,
      # que les DAGs référencent par `{{ conn.waba_minio.login }}`. Aucun secret
      # n'apparaît donc dans le code des DAGs, conformément au §2.1.
      AIRFLOW_CONN_WABA_MINIO: >-
        {"conn_type":"generic","host":"minio","port":9000,
         "login":"${MINIO_ROOT_USER:?}","password":"${MINIO_ROOT_PASSWORD:?}"}
      AIRFLOW_VAR_WABA_SPARK_IMAGE: waba/spark:${WABA_VERSION:-dev}
      AIRFLOW_VAR_WABA_MINIO_ENDPOINT: http://minio:9000
      AIRFLOW_VAR_WABA_ICEBERG_REST_URI: http://iceberg-rest:8181
      AIRFLOW_VAR_WABA_COUNTRIES: ${WABA_COUNTRIES:-CI,SN,ML,BF,GN,TG,BJ,GH}
      AIRFLOW_VAR_WABA_GHS_PER_EUR: ${WABA_GHS_PER_EUR:-17.5}
      AIRFLOW_VAR_WABA_PII_KEY: ${WABA_PII_KEY:-}
    volumes: &airflow-volumes
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      # Accès au démon : c'est par ce socket qu'Airflow démarre les conteneurs
      # Spark. Monté en lecture-écriture car lancer un conteneur est une écriture.
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname WABA --lastname Admin --role Admin --email admin@waba.local || true
        # Un seul emplacement : toutes les tâches Spark écrivent dans le même
        # catalogue Iceberg, dont le backend SQLite n'accepte qu'un écrivain.
        # `max_active_runs` sérialise les exécutions d'un même DAG, mais rien
        # n'empêche deux DAGs différents de commiter en même temps — et un
        # verrou dans le pilote Spark ne peut rien, chaque tâche tournant dans
        # son propre conteneur. Le pool est le seul point où la contrainte
        # s'exprime pour l'ensemble de l'ordonnanceur.
        airflow pools set ${AIRFLOW_CATALOG_POOL:-waba_catalogue} 1 \
          "Écritures dans le catalogue Iceberg — un écrivain à la fois"
        echo "Airflow initialisé"
    restart: "no"
    networks: [waba]

  airflow-scheduler:
    image: waba/airflow:${WABA_VERSION:-dev}
    container_name: waba-airflow-scheduler
    profiles: ["l2", "l3", "l4"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    # Le socket Docker appartient à root:root en 660. Ajouter le groupe root au
    # conteneur suffit à lui en donner l'accès, sans toucher aux permissions du
    # socket lui-même — un `chmod 666` l'ouvrirait à tout l'hôte, bien au-delà
    # du périmètre de ce projet.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 1500m
    networks: [waba]

  airflow-webserver:
    image: waba/airflow:${WABA_VERSION:-dev}
    container_name: waba-airflow-webserver
    profiles: ["l2", "l3", "l4"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "${AIRFLOW_PORT:-8090}:8080"
    command: ["webserver"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    mem_limit: 1200m
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 3.2 — Bus de messages
  # ---------------------------------------------------------------------------
  # Kafka en mode KRaft : le broker assure lui-même le rôle de contrôleur, ce
  # que l'énoncé autorise explicitement. Zookeeper aurait ajouté un service et
  # environ 500 Mo pour une coordination dont un broker unique n'a pas besoin.
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: waba-kafka
    profiles: ["l3", "l4"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Un broker unique ne peut pas répliquer : tout facteur supérieur à 1
      # laisserait les topics internes en attente d'une réplique inexistante.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Sans cette ligne, le broker écrit dans /tmp : le volume monté plus bas
      # reste vide et les topics disparaissent au premier `down`. La panne est
      # silencieuse — tout fonctionne tant que le conteneur vit. En mode KRaft,
      # les métadonnées du cluster suivent le même chemin, si bien que c'est
      # aussi l'identité du cluster qui n'était pas persistée.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Tas plafonné : le défaut de Kafka vise un broker de production, alors
      # que la mémoire est ici la ressource contrainte du niveau.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    networks: [waba]

  # Création idempotente des topics du §3.2. Conteneur one-shot.
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: waba-kafka-init
    profiles: ["l3", "l4"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in ${KAFKA_TOPICS:-raw-bank-transactions raw-insurance-operations raw-mobile-money-payments raw-loan-repayments silver-bank-transactions silver-insurance-operations silver-mobile-money gold-fraud-alerts gold-aml-events gold-liquidity-alerts dlq-financial-events}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions ${KAFKA_PARTITIONS:-3} --replication-factor 1
        done
        echo "--- Topics WABA ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"
    networks: [waba]

  # ---------------------------------------------------------------------------
  # Level 3.1 — Ingestion temps réel
  # ---------------------------------------------------------------------------
  nifi:
    image: ${NIFI_IMAGE:-apache/nifi:2.2.0}
    container_name: waba-nifi
    profiles: ["l3", "l4"]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # NiFi 2 a supprimé l'écoute HTTP en clair : le serveur démarre en HTTPS
      # avec un certificat auto-signé et une authentification mono-utilisateur,
      # quoi qu'on configure. Plutôt que de rétrograder en 1.x pour contourner
      # cette contrainte, le script de construction du flux s'authentifie et
      # présente un jeton — ce qui est de toute façon le comportement attendu
      # d'un client d'API.
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-waba_admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?le mot de passe NiFi doit faire au moins 12 caractères}
      # Sans cela, NiFi se lie au nom d'hôte du conteneur : ni la sonde de santé
      # sur localhost, ni la publication du port depuis l'hôte n'aboutissent.
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"
      NIFI_WEB_PROXY_HOST: "localhost:${NIFI_PORT:-8091},nifi:8443"
      # Tas plafonné : NiFi réserve 2 Go par défaut, ce que le budget mémoire du
      # niveau ne permet pas.
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
      # Les identifiants MinIO sont fournis au flux par variables, jamais
      # inscrits dans sa définition.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${NIFI_PORT:-8091}:8443"
    healthcheck:
      # `-k` accepte le certificat auto-signé généré au démarrage ; un code 401
      # atteste que le serveur répond, l'authentification étant faite ensuite.
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8443/nifi-api/access | grep -qE '200|401'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 2g
    networks: [waba]

volumes:
  minio-data:
  iceberg-catalog:
  airflow-db:
  airflow-logs:
  kafka-data:
  spark-checkpoints:

networks:
  waba:
    name: waba
