# Level 3.4 — exposition du bus de messages en SQL.
#
# C'est ce catalogue qui rend l'architecture Lambda interrogeable : Trino lit
# d'un côté les tables Iceberg du lakehouse, de l'autre les topics Kafka, et une
# même requête peut joindre l'historique consolidé aux événements des dernières
# secondes.
#
# Le connecteur ne se connecte au broker qu'à la première requête : le catalogue
# se charge donc même lorsque Kafka n'est pas démarré, ce qui laisse les profils
# l1 et l2 fonctionner sans lui.
connector.name=kafka
kafka.nodes=kafka:9092
kafka.default-schema=default

# Les topics n'ont pas de schéma : Kafka transporte des octets. Ce sont ces
# fichiers de description qui donnent un type à chaque champ du JSON, et sans
# eux les tables n'exposeraient que les colonnes internes du connecteur.
kafka.table-description-supplier=FILE
kafka.table-description-dir=/etc/trino/kafka
kafka.table-names=silver-bank-transactions,gold-fraud-alerts,gold-aml-events,dlq-financial-events

# Les colonnes internes (`_partition_id`, `_partition_offset`, `_timestamp`,
# `_message`) restent visibles : elles servent à diagnostiquer un flux — savoir
# depuis quel offset une anomalie apparaît, ou relire le message brut d'un rebut.
kafka.hide-internal-columns=false
