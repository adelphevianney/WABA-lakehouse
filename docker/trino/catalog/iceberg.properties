# Catalogue Iceberg de la plateforme WABA, adossé au catalogue REST et à MinIO.
#
# Contrainte du sujet : « aucun credential hardcodé ». Les clés d'accès sont
# résolues à l'exécution depuis les variables d'environnement du conteneur via
# la syntaxe ${ENV:...} de Trino — ce fichier est versionnable tel quel.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/
iceberg.file-format=PARQUET

# Système de fichiers S3 natif de Trino (remplace l'ancien connecteur hive-s3).
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
