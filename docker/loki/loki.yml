# Centralisation des journaux (Level 4.4).
#
# Configuration mono-instance : Loki sait fonctionner en cluster avec un anneau
# de hachage et un stockage objet, ce que la volumétrie de ce déploiement ne
# justifie pas. Le stockage local sur volume suffit et tient en 300 Mo.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Les journaux des conteneurs Docker portent l'horodatage du moteur, qui peut
  # légèrement précéder celui de Loki au démarrage : sans cette tolérance, les
  # premières lignes seraient rejetées comme trop anciennes.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
