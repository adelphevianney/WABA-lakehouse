# Traduction des métriques StatsD d'Airflow en métriques Prometheus.
#
# Airflow encode ses dimensions dans le *nom* de la métrique :
# `airflow.dagrun.duration.success.dag_ingest_raw` plutôt qu'une métrique
# `duration` étiquetée. Sans ces règles, Prometheus verrait une série distincte
# par DAG et par état, impossible à agréger.
mappings:
  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_seconds"
    labels:
      dag_id: "$1"
      etat: "success"

  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_seconds"
    labels:
      dag_id: "$1"
      etat: "failed"

  - match: "airflow.dagrun.*.first_task_scheduling_delay"
    name: "airflow_dagrun_scheduling_delay_seconds"
    labels:
      dag_id: "$1"

  # Compteur d'échecs par tâche : c'est lui qui alimente l'alerte sur le
  # rapport réglementaire.
  - match: "airflow.ti_failures"
    name: "airflow_task_failures_total"
    labels: {}

  - match: "airflow.ti_successes"
    name: "airflow_task_successes_total"
    labels: {}

  # En YAML, une chaîne entre guillemets doubles interprète les échappements :
  # `\.` y est invalide. Les apostrophes conservent la regex telle quelle.
  - match: 'airflow\.operator_failures_(.+)'
    match_type: regex
    name: "airflow_operator_failures_total"
    labels:
      operateur: "$1"

  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.dag_processing.total_parse_time"
    name: "airflow_dag_parse_seconds"
    labels: {}

  # Tout le reste est conservé sous un nom normalisé plutôt qu'ignoré : une
  # métrique inattendue reste consultable, ce qui aide au diagnostic.
  - match: "airflow.(.+)"
    match_type: regex
    name: "airflow_$1"
    labels: {}
