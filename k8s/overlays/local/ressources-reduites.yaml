# Sur un poste de travail, les demandes de la base ne peuvent pas etre honorees
# simultanement : le planificateur laisserait la moitie des pods en attente.
# Les demandes sont ramenees au minimum viable ; les limites, elles, restent
# celles de la base — c'est le depassement qui doit rester borne, pas le
# demarrage.
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/memory
  value: 128Mi
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/cpu
  value: 50m
