apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waba-monitoring

resources:
  - observabilite.yaml

components:
  - ../../components/config-commune

configMapGenerator:
  - name: loki-config
    files:
      - loki.yml=../../../docker/loki/loki.yml
  # Alertes et tableaux de bord Grafana : memes fichiers qu'en Compose, une
  # seule source de verite pour les deux modes de deploiement.
  - name: grafana-alertes
    files:
      - alertes.yml=../../../docker/grafana/provisioning/alerting/alertes.yml
  - name: grafana-fournisseur
    files:
      - dashboards.yml=../../../docker/grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-tableaux
    files:
      - sante-plateforme.json=../../../docker/grafana/dashboards/sante-plateforme.json
