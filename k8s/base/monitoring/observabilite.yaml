# Observabilité : collecte des métriques, centralisation des journaux, et leur
# restitution. Les trois services tiennent dans un seul fichier parce qu'ils
# forment un ensemble : aucun n'a de sens sans les deux autres.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: waba-monitoring
data:
  prometheus.yml: |
    # Une seule chose distingue cette configuration de celle de Compose, mais
    # elle est décisive : les cibles sont désignées par leur nom de service
    # Kubernetes, qualifié par son namespace.
    global:
      scrape_interval: 15s
      external_labels: {plateforme: waba}
    scrape_configs:
      - job_name: trino
        metrics_path: /metrics
        basic_auth: {username: waba, password: ''}
        static_configs:
          - targets: [trino.waba-serving.svc.cluster.local:8080]
            labels: {composant: serving}
      - job_name: kafka
        static_configs:
          - targets: [kafka-exporter.waba-monitoring.svc.cluster.local:9308]
            labels: {composant: ingestion}
      - job_name: airflow
        static_configs:
          - targets: [statsd-exporter.waba-monitoring.svc.cluster.local:9102]
            labels: {composant: processing}
      - job_name: nifi
        static_configs:
          - targets: [nifi-exporter.waba-monitoring.svc.cluster.local:9103]
            labels: {composant: ingestion}
      # Découverte automatique des pods portant l'annotation idoine : c'est le
      # mécanisme que le §4.1 évoque, et il évite de recenser à la main chaque
      # nouveau composant.
      - job_name: pods-annotes
        kubernetes_sd_configs:
          - {role: pod}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: waba-monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: waba-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: waba-prometheus
rules:
  # Lecture seule, et seulement ce que la découverte de cibles exige.
  - apiGroups: ['']
    resources: [nodes, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: waba-prometheus
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: waba-monitoring}
roleRef:
  kind: ClusterRole
  name: waba-prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: waba-monitoring
  labels: {app.kubernetes.io/name: prometheus}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: waba-monitoring
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: waba}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: waba}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {memory: 384Mi, cpu: 100m}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: donnees, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: donnees
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-sources
  namespace: waba-monitoring
data:
  sources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.waba-monitoring.svc.cluster.local:9090
        uid: waba-prometheus
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.waba-monitoring.svc.cluster.local:3100
        uid: waba-loki
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: waba-monitoring
  labels: {app.kubernetes.io/name: grafana}
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: waba-monitoring
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: waba}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: waba}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: waba-secrets, key: GRAFANA_ADMIN}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: waba-secrets, key: GRAFANA_ADMIN_PASSWORD}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false'}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: sources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: alertes, mountPath: /etc/grafana/provisioning/alerting}
            - {name: fournisseur, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: tableaux, mountPath: /etc/grafana/dashboards}
      volumes:
        - name: sources
          configMap: {name: grafana-sources}
        # Alertes et tableaux de bord sont les mêmes fichiers qu'en Compose :
        # Kustomize les génère en ConfigMaps depuis `docker/grafana/`, ce qui
        # évite d'entretenir deux copies destinées à diverger.
        - name: alertes
          configMap: {name: grafana-alertes}
        - name: fournisseur
          configMap: {name: grafana-fournisseur}
        - name: tableaux
          configMap: {name: grafana-tableaux}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: waba-monitoring
  labels: {app.kubernetes.io/name: loki}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100, targetPort: 3100}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: waba-monitoring
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: waba}
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: waba}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: [-config.file=/etc/loki/loki.yml]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: donnees, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
