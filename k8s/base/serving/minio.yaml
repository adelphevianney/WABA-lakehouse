# Object storage — socle de tout le lakehouse.
#
# StatefulSet et non Deployment : MinIO porte l'état de la plateforme, et son
# volume doit lui rester attaché à travers les redémarrages. Le PVC est réclamé
# par le template du StatefulSet, ce qui lie le volume à l'identité de la
# réplique plutôt qu'au pod.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: waba-serving
  labels: {app.kubernetes.io/name: minio}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: waba-serving
  labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: waba}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: waba}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            # Les identifiants viennent d'un Secret généré par Kustomize à
            # partir d'un fichier hors dépôt : aucune valeur en clair ici.
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: waba-secrets, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: waba-secrets, key: MINIO_ROOT_PASSWORD}}
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          # `live` répond dès que le processus est debout ; `ready` atteste que
          # le service accepte des requêtes. Les confondre ferait redémarrer un
          # pod simplement lent à démarrer.
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: donnees, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 20Gi}
---
# Creation idempotente des trois buckets du sujet. Un Job plutot qu'un
# initContainer de MinIO : les buckets se creent *apres* que le serveur reponde,
# pas avant qu'il ne demarre.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: waba-serving
  labels: {app.kubernetes.io/name: minio-init, app.kubernetes.io/part-of: waba}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio-init, app.kubernetes.io/part-of: waba}
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set waba http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "attente de MinIO"; sleep 5
              done
              mc mb --ignore-existing waba/raw-landing waba/lakehouse waba/archive
              mc ls waba
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: waba-secrets, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: waba-secrets, key: MINIO_ROOT_PASSWORD}}
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 128Mi}
