# Bus de messages, en mode KRaft — le broker assure lui-même le rôle de
# contrôleur, ce que l'énoncé autorise et qui économise un service.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: waba-ingestion
  labels: {app.kubernetes.io/name: kafka}
spec:
  clusterIP: None
  # En mode KRaft, le broker s'enregistre aupres du controleur — lui-meme — en
  # passant par son nom DNS. Or un Service sans tete n'publie l'adresse d'un pod
  # qu'une fois celui-ci pret, et le pod ne devient pret qu'apres s'etre
  # enregistre : l'oeuf et la poule. Publier les adresses non pretes rompt le
  # cycle, et c'est la raison d'etre de ce champ.
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: broker, port: 9092, targetPort: 9092}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: waba-ingestion
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: waba}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: waba}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS,
               value: "PLAINTEXT://kafka-0.kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP,
               value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS,
               value: "1@kafka-0.kafka:9093"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            # Un broker unique ne peut pas répliquer : tout facteur supérieur à
            # 1 laisserait les topics internes en attente d'une réplique
            # inexistante.
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            # Sans cette ligne, le broker écrit dans /tmp et le volume reste
            # vide : les topics et l'identité du cluster disparaîtraient au
            # premier redémarrage du pod, sans le moindre signal.
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m"}
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          # Sonde par socket, et non par appel a kafka-broker-api-versions.sh.
          # Ce script lance une JVM a chaque execution : toutes les dix
          # secondes, sur un noeud contraint, il consomme plus de ressources que
          # le broker qu'il surveille et finit par provoquer les delais qu'il
          # est cense detecter. Le compromis est assume — un port ouvert ne
          # prouve pas qu'un broker accepte des productions —, et sur un cluster
          # dote de marge la sonde applicative reste preferable.
          readinessProbe:
            tcpSocket: {port: broker}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            tcpSocket: {port: broker}
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests: {memory: 512Mi, cpu: 200m}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: donnees, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 10Gi}
